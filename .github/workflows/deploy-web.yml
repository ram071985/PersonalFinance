name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'PersonalFinance.Web/**'
      - 'PersonalFinance.Core/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: personalfinance-web
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: './PersonalFinance.Web/PersonalFinance.Web.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: |
          rm -rf ./publish
          dotnet publish "${{ env.PROJECT_PATH }}" -c Release -o ./publish /p:UseAppHost=false
          echo "=== Publish output ==="
          ls -la ./publish
          test -f ./publish/PersonalFinance.Web.dll || {
            echo "ERROR: PersonalFinance.Web.dll was not published"
            exit 1
          }
          test -f ./publish/PersonalFinance.Web.runtimeconfig.json || {
            echo "ERROR: PersonalFinance.Web.runtimeconfig.json missing"
            exit 1
          }
          # Do not ship a second app assembly that confuses Azure startup detection
          rm -f ./publish/PersonalFinance.dll \
                ./publish/PersonalFinance.runtimeconfig.json \
                ./publish/PersonalFinance.deps.json

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
