# Local full stack example (set secrets via env)
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sql;Database=PersonalFinance;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      Jwt__Key: "LocalDockerDevKey_MustBeAtLeast32Characters!"
      Cors__AllowedOrigins__0: "http://localhost:8081"
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: "http://localhost:8080/"
    depends_on:
      - api
